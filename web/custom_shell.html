      font-weight: 400;
      font-display: swap;
    }
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; }
    body { overflow: hidden; background: #d5ebff; color: #151719; touch-action: none; }
    #canvas { display: block; margin: 0; border: 0; outline: none; }
    [hidden] { display: none !important; }
    #status {
      position: fixed;
      inset: 0;
      display: grid;
      place-items: center;
      padding: 20px;
      background: #d5ebff;
      font-family: 'Kosugi Maru', sans-serif;
    }
    .loading-card { width: min(100%, 430px); text-align: center; }
    .loading-title { display: flex; align-items: center; justify-content: center; gap: 14px; }
    .loading-ball {
      width: clamp(42px, 8vw, 72px);
      height: clamp(42px, 8vw, 72px);
      object-fit: contain;
      animation: roll 3s linear infinite;
    }
    h1 { margin: 0; font-size: clamp(26px, 6vw, 48px); font-weight: 400; letter-spacing: -1px; }
    #loading-message { margin: 22px 0 12px; font-size: clamp(13px, 3vw, 17px); }
    .progress-track {
      overflow: hidden;
      border: 3px solid #151719;
      border-radius: 10px 8px 11px 7px;
      background: #fff;
    }
    progress { display: block; width: 100%; height: 15px; border: 0; appearance: none; background: #fff; accent-color: #151719; }
    progress::-webkit-progress-bar { background: #fff; }
    progress::-webkit-progress-value { background: #151719; }
    progress::-moz-progress-bar { background: #151719; }
    progress:not([value]) { opacity: 0.65; }
    #loading-percent { display: block; min-height: 1.4em; margin-top: 10px; font-size: 13px; font-variant-numeric: tabular-nums; }
    #status-notice { margin-top: 16px; line-height: 1.5; white-space: pre-line; overflow-wrap: anywhere; }
    #retry { margin-top: 12px; padding: 10px 20px; border: 2px solid #151719; border-radius: 7px; color: #151719; background: #fff; font: inherit; cursor: pointer; }
    #retry:focus-visible { outline: 3px solid #151719; outline-offset: 4px; }
    @keyframes roll { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) { .loading-ball { animation: none; } }
  </style>
  $GODOT_HEAD_INCLUDE
</head>
<body>
  <canvas id="canvas" aria-label="Speed Balls game">Your browser does not support canvas.</canvas>
  <div id="status">
    <div class="loading-card">
      <div class="loading-title">
        <img class="loading-ball" src="$GODOT_SPLASH" width="72" height="72" alt="">
        <h1>Speed Balls</h1>
      </div>
      <p id="loading-message" role="status">Loading game...</p>
      <div class="progress-track"><progress id="status-progress" max="100" aria-label="Game download progress"></progress></div>
      <span id="loading-percent" aria-hidden="true">Getting ready</span>
      <p id="status-notice" role="alert" hidden></p>
      <button id="retry" type="button" hidden>Try again</button>
      <noscript><p>Enable JavaScript to play Speed Balls.</p></noscript>
    </div>
  </div>
  <script src="$GODOT_URL"></script>
  <script>
    const GODOT_CONFIG = $GODOT_CONFIG;
    const GODOT_THREADS_ENABLED = $GODOT_THREADS_ENABLED;
    const overlay = document.getElementById('status');
    const progress = document.getElementById('status-progress');
    const percent = document.getElementById('loading-percent');
    const message = document.getElementById('loading-message');
    const notice = document.getElementById('status-notice');
    const retry = document.getElementById('retry');
    let loadFailed = false;

    retry.addEventListener('click', () => window.location.reload());

    // Some Godot engine versions reject an internal preload promise without
    // forwarding it to startGame(). Keep those failures in the loading UI too.
    function handleStartupError(event) {
      event.preventDefault();
      showLoadError(event.reason || event.error || event.message);
    }

    function detachStartupErrors() {
      window.removeEventListener('unhandledrejection', handleStartupError);
      window.removeEventListener('error', handleStartupError);
    }

    function showLoadError(error) {
      if (loadFailed || !overlay.isConnected) return;
      loadFailed = true;
      detachStartupErrors();
      message.textContent = 'The game could not load.';
      notice.textContent = error instanceof Error ? error.message : String(error);
      notice.hidden = false;
      retry.hidden = false;
      document.querySelector('.progress-track').hidden = true;
      percent.hidden = true;
      document.querySelector('.loading-ball').style.animation = 'none';
    }

    window.addEventListener('unhandledrejection', handleStartupError);
    window.addEventListener('error', handleStartupError);

    async function startGame() {
      try {
        if (typeof Engine === 'undefined') throw new Error('Could not download the game engine. Check your connection and try again.');
        const missing = Engine.getMissingFeatures({ threads: GODOT_THREADS_ENABLED });
        if (missing.length) throw new Error('This browser is missing features needed by the game:\n' + missing.join('\n'));
        const engine = new Engine(GODOT_CONFIG);
        await engine.startGame({
          onProgress(current, total) {
            if (loadFailed) return;
            if (total > 0) {
              const value = Math.max(0, Math.min(100, Math.floor(current / total * 100)));
              progress.value = value;
              percent.textContent = value + '%';
              if (value === 100) message.textContent = 'Starting game...';
            } else {
              progress.removeAttribute('value');
              percent.textContent = 'Getting ready';
            }
          },
        });
        if (!loadFailed) {
          detachStartupErrors();
          overlay.remove();
        }
      } catch (error) {
        showLoadError(error);
      }
    }
    startGame();
  </script>
</body>
</html>
